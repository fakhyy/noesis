services:
  db:
    image: postgres:17-alpine
    container_name: noesis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: noesis
      POSTGRES_PASSWORD: noesis_dev
      POSTGRES_DB: noesis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noesis -d noesis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: